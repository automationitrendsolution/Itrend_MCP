# Local development services only. Not used in production.
#
# Start:  docker compose -f deployment/docker-compose.dev.yml --env-file .env up -d
# Stop:   docker compose -f deployment/docker-compose.dev.yml --env-file .env down
#
# Credentials come from the project's .env file (DB_NAME, DB_USER, DB_PASSWORD).

name: itrend-mcp-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: itrend-mcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
