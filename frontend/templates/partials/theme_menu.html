{# Theme selector: Light / Dark / System. The choice is stored in this browser (static/js/app.js). #}
<div class="dropdown">
  <button class="pg-icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Theme" title="Theme">
    <i class="bi bi-circle-half" aria-hidden="true"></i>
  </button>
  <ul class="dropdown-menu dropdown-menu-end" role="menu" aria-label="Theme">
    <li><h2 class="dropdown-header">Theme</h2></li>
    <li><button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-pg-theme="light"><i class="bi bi-sun" aria-hidden="true"></i>Light<i class="bi bi-check2 pg-menu-check" aria-hidden="true"></i></button></li>
    <li><button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-pg-theme="dark"><i class="bi bi-moon" aria-hidden="true"></i>Dark<i class="bi bi-check2 pg-menu-check" aria-hidden="true"></i></button></li>
    <li><button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-pg-theme="system"><i class="bi bi-display" aria-hidden="true"></i>System<i class="bi bi-check2 pg-menu-check" aria-hidden="true"></i></button></li>
  </ul>
</div>
