{# Previous/next links for a Paginator page, keeping the current filters in the URL. #}
{% if page.has_other_pages %}
  <div class="card-footer d-flex justify-content-between align-items-center small">
    <span class="text-body-secondary">{{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
    <nav aria-label="Pagination" class="btn-group">
      {% if page.has_previous %}
        <a class="btn btn-sm btn-outline-secondary" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key|urlencode }}={{ value|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>
      {% endif %}
      {% if page.has_next %}
        <a class="btn btn-sm btn-outline-secondary" href="?{% for key, value in request.GET.items %}{% if key != 'page' %}{{ key|urlencode }}={{ value|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>
      {% endif %}
    </nav>
  </div>
{% endif %}
