[project]
name = "mysql-mcp"
version = "0.1.0"
description = "Read-only MySQL MCP server for the iTrend MCP Platform (Streamable HTTP)."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mysql-mcp = "mysql_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
